{% if product_list %}
    <table>
        <thead>
            <tr>
                <th>Product name</th>
                <th>Description</th>
                <th>Category</th>
                <th>Tags</th>
            </tr>
        </thead>
        <tbody>
        {% for product in product_list %}
            <tr>
                <td>{{ product.name }}</td>
                <td>{{ product.description}}</td>
                <td>{{ product.category.name }}</td>
                <td>{{ product.tags_as_str }}</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
{% else %}
    <p>No products are available.</p>
{% endif %}
